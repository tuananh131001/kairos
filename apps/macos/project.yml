name: Kairos
options:
  bundleIdPrefix: com.kairos
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: ${KAIROS_TEAM_ID}
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
targets:
  Kairos:
    type: application
    platform: macOS
    sources:
      - path: Kairos
        excludes:
          - Resources/Info.plist
          - Resources/com.kairos.daemon.plist
      - path: Kairos/Resources/com.kairos.daemon.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    settings:
      base:
        PRODUCT_NAME: Kairos
        PRODUCT_BUNDLE_IDENTIFIER: com.kairos.app
        INFOPLIST_FILE: Kairos/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Embed kairosd
        basedOnDependencyAnalysis: false
        script: |
          set -e
          for candidate in "${SRCROOT}/../../build/kairosd" "${SRCROOT}/../../target/release/kairosd"; do
            if [ -x "$candidate" ]; then
              dest="${TARGET_BUILD_DIR}/${EXECUTABLE_FOLDER_PATH}/kairosd"
              cp "$candidate" "$dest"
              if [ -n "${EXPANDED_CODE_SIGN_IDENTITY}" ]; then
                codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY}" --identifier com.kairos.daemon "$dest"
              fi
              exit 0
            fi
          done
          echo "warning: kairosd not built yet; run scripts/build.sh or cargo build --release -p kairosd"
  KairosTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: KairosTests
    dependencies:
      - target: Kairos
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.kairos.app.tests
schemes:
  Kairos:
    build:
      targets:
        Kairos: all
        KairosTests: [test]
    test:
      targets:
        - KairosTests
